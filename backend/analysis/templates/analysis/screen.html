{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 분석</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #142239;
      color: #f3f4f6;
      font: 16px/1.5 "Malgun Gothic", system-ui, sans-serif;
      color-scheme: dark;
    }

    header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
      gap: 24px;
      padding: 14px 3%;
      background: #0b1529;
    }

    header a { color: inherit; text-decoration: none; }

    main {
      width: 90%;
      max-width: 1660px;
      margin: clamp(40px, 10vh, 110px) auto;
    }

    h1, h2 { margin: 0 0 14px; font-size: clamp(22px, 2vw, 30px); }

    .layout {
      display: grid;
      grid-template-columns: 0.86fr 1fr;
      gap: 3.2%;
    }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 1.89;
      background: #3c5273;
      object-fit: contain;
    }

    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }

    .start {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      border: 0;
      border-radius: 6px;
      background: #496e94;
      font-weight: bold;
    }

    .tabs { display: flex; margin-bottom: 12px; }

    .tabs button {
      padding: 10px 20px;
      background: transparent;
      border: 1px solid transparent;
      border-bottom-color: #9aaabe;
    }

    .tabs button[aria-pressed="true"] {
      border-color: #9aaabe;
      border-bottom-color: transparent;
      border-radius: 7px 7px 0 0;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      min-width: 0;
      padding: 11px;
      border: 1px solid #9aaabe;
      border-radius: 6px;
      background: #15243b;
    }

    input::placeholder { color: #acbbcc; }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 12px 0 24px;
    }

    label { display: grid; gap: 5px; }

    .results { display: flex; gap: 8%; padding: 0 5%; }

    .results span {
      flex: 1;
      text-align: center;
      border-radius: 6px;
      font-size: clamp(30px, 3vw, 48px);
      font-weight: 600;
    }

    .ng { background: #875561; }
    .ok { background: #50796f; }
    #message { color: #d5dfed; }

    @media (max-width: 740px) {
      header { gap: 12px; font-size: 14px; }
      .layout, .fields { grid-template-columns: 1fr; }
      .layout { gap: 24px; }
    }

    .results[data-verdict="OK"] .ok { box-shadow: 0 0 12px 3px #56c79c; }
    .results[data-verdict="NG"] .ng { box-shadow: 0 0 12px 3px #e8788c; }
  </style>
</head>

<body>
  <header>
    <a href="/analyses/">AI 분석</a>
    <span>대시보드</span>
    <span>내 정보</span>
    <a href="/admin/">Admin</a>
    <span>admin · 관리자</span>
    <span>로그아웃</span>
  </header>

  <main>
    <h1>AI 분석</h1>

    <div class="layout">
      <section aria-label="영상 미리보기">
        <video id="preview" playsinline aria-label="선택한 영상"></video>
        <button type="button" class="start" id="start">AI 분석 시작</button>
        <p id="message" role="status"></p>
      </section>

      <section aria-label="분석 설정 및 결과">
        <div class="tabs">
          <button type="button" id="uploadTab" aria-pressed="true">영상 업로드</button>
          <button type="button" id="cameraTab" aria-pressed="false">IP Webcam</button>
        </div>

        <input id="file" type="file" accept="video/*,.avi,.mkv" aria-label="영상 파일 선택">
        <input id="address" type="url" placeholder="카메라 영상 URL" aria-label="카메라 영상 URL" hidden>

        <div class="fields">
          <label>
            수행하려는 동작 (선택 · 정답 아님)
            <select>
              <option value="">선택 안 함</option>
              <option>손 흔들기</option>
            </select>
          </label>

          <label>
            제목 (선택)
            <input type="text" placeholder="예: 손 흔들기 1회차">
          </label>
        </div>

        <h2>분석 결과</h2>
        {% csrf_token %}
        <div class="results" data-api="">
          <span class="ng">NG</span>
          <span class="ok">OK</span>
        </div>
      </section>
    </div>
  </main>

  <script src="{% static 'analysis/screen.js' %}"></script>
</body>
</html>
