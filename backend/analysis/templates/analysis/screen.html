{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 분석</title>

  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      font: 16px/1.5 "Malgun Gothic", system-ui, sans-serif;
    }

    main {
      width: 90%;
      max-width: 1660px;
      margin: 10vh auto;
    }

    h1, h2 { margin: 0 0 12px; }
    button, input, select { font: inherit; }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 0.86fr) minmax(0, 1fr);
      gap: 3.2%;
    }

    .preview {
      display: block;
      width: 100%;
      aspect-ratio: 1.89;
      object-fit: contain;
    }

    #start {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      font-weight: bold;
    }

    .tabs { display: flex; }

    .tabs button {
      padding: 8px 18px;
      border: 0;
      border-bottom: 1px solid;
      background: none;
      cursor: pointer;
    }

    .tabs button[aria-pressed="true"] {
      border: 1px solid;
      border-bottom: 0;
      border-radius: 5px 5px 0 0;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      min-width: 0;
      padding: 8px;
      border: 1px solid;
      border-radius: 5px;
    }

    #videoFile, #cameraForm { margin: 8px 0; }

    .camera-row {
      display: flex;
      gap: 8px;
    }

    .camera-row input { flex: 1; }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .fields label {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .results {
      display: flex;
      gap: 8%;
      padding: 0 5%;
    }

    .results span {
      flex: 1;
      border: 1px solid;
      border-radius: 5px;
      text-align: center;
      font-size: clamp(30px, 3vw, 48px);
      font-weight: 600;
    }

    @media (max-width: 740px) {
      .layout, .fields { grid-template-columns: 1fr; }
      .layout { gap: 24px; }
    }

    .results[data-verdict="OK"] .ok,
    .results[data-verdict="NG"] .ng {
      outline: 3px solid currentColor;
      }

#analysisStatus:empty {
  display: none;
}
  </style>
</head>

<body>
  <main>
    <h1>AI 분석</h1>

    <div class="layout">
      <div>
        <video id="videoPreview" class="preview"
               controls playsinline preload="metadata"
               aria-label="영상 미리보기"></video>

        <img id="cameraPreview" class="preview" alt="IP Webcam 실시간 영상" hidden>

        {% csrf_token %}
        <button type="button" id="start" disabled>AI 추론 시작</button>
        <p id="analysisStatus" role="status"></p>
      </div>

      <div>
        <div class="tabs" role="group" aria-label="영상 입력 방식">
          <button type="button" id="uploadTab" aria-pressed="true">영상 업로드</button>
          <button type="button" id="cameraTab" aria-pressed="false">IP Webcam</button>
        </div>

        <input type="file" id="videoFile" accept="video/*" aria-label="동영상 파일 선택">

        <form id="cameraForm" hidden>
          <label for="cameraUrl">카메라 영상 주소 (포트 포함)</label>
          <div class="camera-row">
            <input type="url" id="cameraUrl"
                   placeholder="http://192.168.0.10:8080/video" required>
            <button type="submit">연결</button>
          </div>
          <small id="cameraStatus" role="status"></small>
        </form>

        <div class="fields">
          <label>
            비교할 동작 (선택)
            <select id="action">
              <option value="">파일명에서 확인</option>
              <option value="wave">손 흔들기</option>
            </select>
          </label>

          <label>
            제목 (선택)
            <input type="text" placeholder="예: 손 흔들기 1회차">
          </label>
        </div>

        <h2>분석 결과</h2>
        <div class="results" data-api="{% url 'analyze' %}">
          <span class="ng">NG</span>
          <span class="ok">OK</span>
        </div>
      </div>
    </div>
  </main>

  <script src="{% static 'analysis/screen.js' %}"></script>
</body>
</html>
