{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 분석</title>

  <style>
    :root {
      color-scheme: dark;
      --page: #142239;
      --field: #15243b;
      --edge: #9aaabe;
      --text: #f3f4f6;
      --focus: #c9def8;
    }

    * { box-sizing: border-box; }
    [hidden], #analysisStatus:empty { display: none; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font: clamp(12px, 1vw, 16px)/1.5 "Malgun Gothic", system-ui, sans-serif;
    }

    main {
      max-width: 1820px;
      margin-inline: auto;
      padding: clamp(24px, 2vw, 40px) min(5.2vw, 94px) 32px min(3.4vw, 62px);
    }

    h1, h2 {
      margin: 0;
      font-size: clamp(20px, 1.7vw, 30px);
      line-height: 1.4;
    }

    h1 { margin-bottom: 8px; }
    button, input, select { font: inherit; color: inherit; }
    button:enabled, select { cursor: pointer; }

    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 0.86fr) minmax(0, 1fr);
      gap: 3.2%;
    }

    .preview-frame {
      aspect-ratio: 1.89;
      overflow: hidden;
      background: #3c5273;
    }

    .preview:not([hidden]) {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #videoPreview:not([src]) { visibility: hidden; }

    #start, .camera-row button {
      border: 0;
      border-radius: 4px;
      background: #527ba5;
      font-weight: 700;
    }

    #start {
      width: 100%;
      margin-top: 8px;
      padding: 0.65em 1em;
    }

    #start:disabled { background: #496e94; }
    #start:enabled:hover, .camera-row button:hover { background: #6084ac; }

    .tabs { display: flex; }

    .tabs button {
      padding: 0.48em 1.15em;
      border: 1px solid transparent;
      border-bottom-color: var(--edge);
      background: transparent;
    }

    .tabs button[aria-pressed="true"] {
      border-color: var(--edge);
      border-bottom-color: transparent;
      border-radius: 4px 4px 0 0;
      font-weight: 700;
    }

    input:not([type="hidden"]), select {
      width: 100%;
      min-width: 0;
      padding: 0.55em 0.65em;
      border: 1px solid var(--edge);
      border-radius: 4px;
      background: var(--field);
    }

    input::placeholder { color: #b9c5d5; }
    #videoFile, #cameraForm { margin: 8px 0; }
    #videoFile::file-selector-button {
      padding: 0 0.4em;
      border: 0;
      border-radius: 2px;
      background: #526276;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    .camera-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .camera-row input { flex: 1; }
    .camera-row button { padding-inline: 1.2em; }

    .fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .fields label {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .results {
      display: flex;
      gap: 8%;
      margin-top: 24px;
      padding-inline: 5%;
    }

    .results span {
      flex: 1;
      border-radius: 4px;
      text-align: center;
      font-size: clamp(30px, 2.65vw, 48px);
      font-weight: 700;
    }

    .ng { background: #875561; }
    .ok { background: #50796f; }

    .results[data-verdict="NG"] .ng,
    .results[data-verdict="OK"] .ok {
      outline: 3px solid var(--text);
      outline-offset: 2px;
    }

    @media (max-width: 740px) {
      body { font-size: 14px; }
      main { padding: 20px 16px 32px; }
      .layout, .fields { grid-template-columns: 1fr; }
      .layout { gap: 24px; }
      .tabs button, #start, .camera-row button { min-height: 40px; }
      .results { gap: 12px; margin-top: 16px; padding: 0; }
    }
  </style>
</head>

<body>
  <main>
    <h1>AI 분석</h1>

    <div class="layout">
      <div>
        <div class="preview-frame">
          <video id="videoPreview" class="preview"
                 controls playsinline preload="metadata"
                 aria-label="영상 미리보기"></video>
          <img id="cameraPreview" class="preview" alt="IP Webcam 실시간 영상" hidden>
        </div>

        {% csrf_token %}
        <button type="button" id="start" disabled>AI 분석 시작</button>
        <p id="analysisStatus" role="status"></p>
      </div>

      <div>
        <div class="tabs" role="group" aria-label="영상 입력 방식">
          <button type="button" id="uploadTab" aria-pressed="true">영상 업로드</button>
          <button type="button" id="cameraTab" aria-pressed="false">IP Webcam</button>
        </div>

        <input type="file" id="videoFile" accept="video/*" aria-label="동영상 파일 선택">

        <form id="cameraForm" hidden>
          <label for="cameraUrl">카메라 영상 주소 (포트 포함)</label>
          <div class="camera-row">
            <input type="url" id="cameraUrl"
                   placeholder="http://192.168.0.10:8080/video" required>
            <button type="submit">연결</button>
          </div>
          <small id="cameraStatus" role="status"></small>
        </form>

        <div class="fields">
          <label>
            비교할 동작 (선택)
            <select id="action">
              <option value="">파일명에서 확인</option>
              <option value="bend_return">허리 굽혔다 펴기</option>
              <option value="leg_raise_lower">한쪽 다리 들었다 내리기</option>
              <option value="walk_turn_walk">걷다가 방향 바꾸기</option>
              <option value="drink_return">음료 마시기</option>
              <option value="sit_stand">앉았다 일어나기</option>
              <option value="wave">손 흔들기</option>
            </select>
          </label>

          <label>
            제목 (선택)
            <input type="text" placeholder="예: 손 흔들기 1회차">
          </label>
        </div>

        <h2>분석 결과</h2>
        <div class="results" data-api="{% url 'analyze' %}">
          <span class="ng">NG</span>
          <span class="ok">OK</span>
        </div>
      </div>
    </div>
  </main>

  <script src="{% static 'analysis/screen.js' %}"></script>
</body>
</html>
